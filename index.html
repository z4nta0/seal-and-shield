<!doctype html><!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'><!-- What: Root HTML Element. Why: Screen readers and translation tools need the page's language. How: This marks the document as English. -->


	<head><!-- What: Document Head Element. Why: The page's metadata and icon link load before the body paints. How: This holds them in the sections below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />                                                 <!-- What: Character Set Meta. Why: The browser has to decode the page as UTF-8 before it reads anything else. How: This sits first in the head, inside the first 1,024 bytes the browser checks. -->
		<meta name='viewport' content='width=device-width, initial-scale=1.0' /> <!-- What: Viewport Meta. Why: Phones should lay the site out at device width instead of a zoomed-out desktop width. How: This sets the layout width to the device's and starts at no zoom. -->
		<title>Commercial Roofing in Lawrence, KS | Seal and Shield</title>      <!-- What: Page Title Element. Why: The tab, bookmarks, and search listings name the page by its title, and local searches look for the service and the city. How: This names what the company does and where, then the company. -->

		<!-- #endregion Document -->


		<!-- #region Search -->

		<meta name='author'      content='Seal and Shield LLC' />      <!-- What: Author Meta. Why: Search engines and link preview inspectors look for who a page belongs to, and on a real business's site that's the business itself. How: This names the company by its legal name. -->
		<link href='https://sealandshieldroof.com/' rel='canonical' /> <!-- What: Canonical Link. Why: Netlify also serves the site at deploy preview and netlify.app addresses, which should all count as one page. How: This names the live address as the page's own. -->
		<meta name='description' content='Commercial roofing in Lawrence, Kansas: full installations, repairs, Conklin coatings, TPO and EPDM, and free inspections.' /> <!-- What: Description Meta. Why: Search listings show a short summary under the title, and it should name the city and the services people search for. How: This sums up the company's main services and where it's based, in about 120 characters so phones show it whole. -->

		<!-- #endregion Search -->


		<!-- #region Web App -->

		<meta name='theme-color' content='#080f24' /> <!-- What: Theme Color Meta. Why: Mobile browsers tint their chrome around the page, and Discord edges its link previews in this color. How: This sets it to the dark navy of the bar and hero. -->

		<!-- #endregion Web App -->


		<!-- #region Icons -->

		<link href='/favicon.png' rel='icon' type='image/png' /> <!-- What: PNG Icon Link. Why: Browsers show the site's mark in tabs and bookmarks. How: This points at the PNG favicon in public/. -->

		<!-- #endregion Icons -->


		<!-- #region Structured Data -->

		<script type='application/ld+json'>
			{
				"@context": "https://schema.org",
				"@type": "RoofingContractor",
				"name": "Seal and Shield",
				"legalName": "Seal and Shield LLC",
				"url": "https://sealandshieldroof.com/",
				"telephone": "+1-785-304-1957",
				"description": "Commercial roofing in Lawrence, Kansas: full installations, repairs, Conklin coatings, TPO and EPDM, and free inspections.",
				"foundingDate": "2024",
				"address": {
					"@type": "PostalAddress",
					"addressLocality": "Lawrence",
					"addressRegion": "KS",
					"addressCountry": "US"
				},
				"openingHoursSpecification": [
					{
						"@type": "OpeningHoursSpecification",
						"dayOfWeek": [
							"Monday",
							"Tuesday",
							"Wednesday",
							"Thursday",
							"Friday"
						],
						"opens": "08:00",
						"closes": "17:00"
					}
				],
				"areaServed": [
					{
						"@type": "City",
						"name": "Lawrence, KS"
					},
					{
						"@type": "City",
						"name": "Topeka, KS"
					},
					{
						"@type": "Place",
						"name": "Kansas City metro area"
					},
					{
						"@type": "State",
						"name": "Kansas"
					},
					{
						"@type": "Place",
						"name": "Continental United States"
					}
				]
			}
		</script><!-- What: Business Structured Data Script. Why: Search engines read JSON-LD to show a local business's details, and every detail has to match what the page shows. How: This describes the company as a RoofingContractor with its name, legal name, live address, phone, Lawrence city with no street address, weekday 8 to 5 hours, founding year, and the five service areas the Services section lists. -->

		<!-- #endregion Structured Data -->


	</head>



	<body><!-- What: Document Body Element. Why: This holds the site's mount point, the form copy Netlify reads, and the entry script. How: The mount point stays empty until React renders the site into it. -->


		<div id='appMouDiv'></div><!-- What: App Mount Div Element. Why: React needs one element to render the site into. How: main.tsx renders the app into this id. -->

		<form
			data-netlify='true'
			name='contactForm'

			hidden
		><!-- What: Netlify Detection Form Element. Why: Netlify finds forms by reading the deployed HTML, and the real contact form only exists once React renders it. How: This hidden, bare copy names the form and each field the React form submits, with no ids, so it never duplicates the real form's, and an aria-label on each field so accessibility checkers find every control named. -->


			<input
				name='name'

				type='text'

				aria-label='Name'
			/><!-- What: Name Input Element. Why: Netlify records only the fields it finds in this copy. How: This declares the name field, which carries the visitor's name. -->

			<input
				name='company'

				type='text'

				aria-label='Company'
			/><!-- What: Company Input Element. Why: Netlify records only the fields it finds in this copy. How: This declares the company field, which carries the visitor's company. -->

			<input
				name='phone'

				type='tel'

				aria-label='Phone'
			/><!-- What: Phone Input Element. Why: Netlify records only the fields it finds in this copy. How: This declares the phone field, which carries the visitor's phone number. -->

			<input
				name='email'

				type='email'

				aria-label='Email'
			/><!-- What: Email Input Element. Why: Netlify records only the fields it finds in this copy. How: This declares the email field, which carries the visitor's email address. -->

			<textarea
				name='message'

				aria-label='Message'
			></textarea><!-- What: Message Textarea Element. Why: Netlify records only the fields it finds in this copy. How: This declares the message field, which carries the visitor's description of their roof. -->


		</form>

		<script
			src='/src/main.tsx'
			type='module'
		>/* What: Site Module Script Element. Why: This loads the site itself. How: Vite replaces it with the built, hashed bundle at build time. */</script>


	</body>


</html>
