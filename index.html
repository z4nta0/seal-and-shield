<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Seal and Shield LLC – Commercial Roofing in Lawrence, Kansas. Full installations, repairs, liquid coatings, TPO, EPDM. Serving all of Kansas and the continental US." />
    <title>Seal and Shield LLC | Commercial Roofing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- What: Netlify Form Detection Copy. Why: Netlify finds forms by reading the deployed HTML, and the real contact form only exists once React renders it. How: This hidden, bare copy names the form and each field the React form submits, with no ids or labels, so it never duplicates the real form's. -->
    <form hidden name='contactForm' data-netlify='true'>
      <input name='name' type='text' />
      <input name='company' type='text' />
      <input name='phone' type='tel' />
      <input name='email' type='email' />
      <textarea name='message'></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
